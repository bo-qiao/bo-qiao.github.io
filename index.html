---
layout: default
---

<h2 class="post-list-heading">Latest Posts</h2>
<ul class="post-list">
  {% for post in paginator.posts limit:5 %}
  <li><span class="post-meta">{{ post.date | date: "%b %d, %Y" }}</span> <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>

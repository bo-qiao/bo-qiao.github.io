<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234cc9f0'/%3E%3Cpath%20d='M4%2022%20L12%2010%20L16%2016%20L20%206%20L28%2015%20L28%2028%20L4%2028%20Z'%20fill='%23ffffff'/%3E%3C/svg%3E">
</head>
<body>
  <div class="site-layout">
    <aside class="site-sidebar">
      <div class="sidebar-inner">
        <img class="avatar" src="{{ '/assets/images/avatar.png' | relative_url }}" alt="{{ site.title }}">
      </div>
    </aside>

    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <aside class="site-sidebar-right">
      <nav class="site-nav side-nav-right">
        <a class="page-link" href="{{ '/' | relative_url }}">Posts</a>
        <a class="page-link" href="{{ '/gallery.html' | relative_url }}">Gallery</a>
        <a class="page-link" href="{{ '/about.html' | relative_url }}">About</a>
      </nav>
    </aside>
  </div>

</body>
</html>
